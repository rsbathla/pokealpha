<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0b10" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>PokéAlpha CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0b10; --bg2:#12141c; --card:#161922; --card2:#1c2030;
    --line:#262b3a; --line2:#323a4f;
    --txt:#e9ecf5; --muted:#8b93a8; --muted2:#5d6478;
    --accent:#6c8cff; --accent2:#4f6ef0;
    --green:#34d399; --greenbg:rgba(52,211,153,.12);
    --red:#f87171; --redbg:rgba(248,113,113,.12);
    --amber:#fbbf24; --amberbg:rgba(251,191,36,.12);
    --blue:#60a5fa; --purple:#a78bfa; --pink:#f472b6;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  #app{max-width:560px;margin:0 auto;padding:0 0 96px;min-height:100vh}
  header.top{position:sticky;top:0;z-index:20;background:rgba(10,11,16,.86);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
    padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between}
  header.top h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.3px}
  header.top h1 span{color:var(--accent)}
  .tabtitle{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
  .sync-stat{font-size:10px;font-weight:700;letter-spacing:.3px;cursor:pointer;margin-top:2px;text-align:right}
  .view{padding:16px 16px 0;display:none}
  .view.active{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* stat cards */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
  .stat .lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:5px}
  .stat .val{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--txt)}

  /* chips */
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.12s}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{opacity:.7;margin-left:4px;font-weight:500}

  /* item rows */
  .list{display:flex;flex-direction:column;gap:9px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;
    display:flex;gap:11px;cursor:pointer;transition:.12s;align-items:center}
  .item:active{transform:scale(.992);background:var(--card2)}
  .thumb{width:52px;height:52px;border-radius:10px;flex:0 0 auto;object-fit:cover;
    background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted2)}
  .item .body{flex:1;min-width:0}
  .item .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .meta{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .right{text-align:right;flex:0 0 auto}
  .item .pnl{font-weight:800;font-size:14px}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase;margin-top:4px}
  .b-owned{background:var(--card2);color:var(--muted)}
  .b-atpsa{background:var(--purple);color:#1a1030;background:rgba(167,139,250,.16);color:var(--purple)}
  .b-consign{background:rgba(96,165,250,.16);color:var(--blue)}
  .b-listed{background:var(--amberbg);color:var(--amber)}
  .b-sold{background:var(--greenbg);color:var(--green)}
  .route-tag{font-size:10px;color:var(--muted2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

  .section-h{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:18px 2px 9px}
  .empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:14px}
  .empty .big{font-size:34px;margin-bottom:10px}

  /* source rows */
  .src{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
  .src .top{display:flex;justify-content:space-between;align-items:baseline}
  .src .name{font-weight:700;font-size:14.5px}
  .src .roi{font-weight:800;font-size:14px}
  .src .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}
  .src .g .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .src .g .v{font-size:13.5px;font-weight:700;margin-top:1px}
  .bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:3px;background:var(--green)}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--accent);color:#fff;border:none;border-radius:13px;padding:14px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.12s}
  .btn:active{transform:scale(.99)}
  .btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  .btn.danger{background:var(--redbg);color:var(--red);border:1px solid rgba(248,113,113,.3)}
  .btn.sm{padding:10px;font-size:13.5px;border-radius:11px}
  .btn-row{display:flex;gap:9px}

  /* FAB */
  .fab{position:fixed;right:max(18px,calc(50% - 280px + 18px));bottom:84px;z-index:30;
    width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;
    font-size:28px;font-weight:300;box-shadow:0 8px 24px rgba(76,110,240,.45);cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .fab:active{transform:scale(.93)}

  /* bottom nav */
  nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(13,15,22,.92);
    backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  nav.bottom button{flex:1;background:none;border:none;color:var(--muted2);font-family:inherit;
    padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;transition:.12s}
  nav.bottom button.on{color:var(--accent)}
  nav.bottom button svg{width:21px;height:21px}

  /* modal / bottom sheet */
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
    display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);max-height:92vh;overflow-y:auto;
    padding:8px 18px calc(28px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grab{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:8px auto 14px}
  .sheet h2{font-size:18px;font-weight:800;margin:0 0 4px}
  .sheet .sub{color:var(--muted);font-size:13px;margin:0 0 16px}

  label.f{display:block;margin-bottom:13px}
  label.f .t{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block}
  input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:12px;font-family:inherit;font-size:15px;outline:none;transition:.12s}
  input:focus,select,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:62px;font-size:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238b93a8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center}

  /* photo dropzone */
  .photo-zone{border:1.5px dashed var(--line2);border-radius:13px;padding:16px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:13px;transition:.12s}
  .photo-zone:active{background:var(--card)}
  .photo-prev{position:relative;margin-bottom:13px}
  .photo-prev img{width:100%;border-radius:13px;display:block;max-height:240px;object-fit:contain;background:var(--card)}
  .photo-prev .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:rgba(0,0,0,.65);color:#fff;border:none;font-size:17px;cursor:pointer}
  .scan-btn{margin-bottom:13px}

  .pnl-box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin:4px 0 16px}
  .pnl-box .r{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0}
  .pnl-box .r .k{color:var(--muted)}
  .pnl-box .r.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:15px}

  .note{font-size:12px;color:var(--muted);line-height:1.5;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:13px}
  .note b{color:var(--txt)}
  .warn{background:var(--amberbg);border-color:rgba(251,191,36,.3);color:var(--amber)}
  .ok{background:var(--greenbg);border-color:rgba(52,211,153,.3);color:var(--green)}
  .err{background:var(--redbg);border-color:rgba(248,113,113,.3);color:var(--red)}

  .import-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
  .import-card h3{font-size:14.5px;font-weight:700;margin:0 0 4px}
  .import-card p{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}

  /* review table for parsed imports */
  .review{max-height:46vh;overflow-y:auto;margin-bottom:13px;border:1px solid var(--line);border-radius:12px}
  .rev-row{display:flex;gap:9px;align-items:center;padding:10px 11px;border-bottom:1px solid var(--line)}
  .rev-row:last-child{border-bottom:none}
  .rev-row .ck{flex:0 0 auto}
  .rev-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  .rev-row .rb{flex:1;min-width:0}
  .rev-row .rt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rev-row .rm{font-size:11px;color:var(--muted)}
  .rev-row .rp{font-weight:700;font-size:13px;flex:0 0 auto}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--card2);border:1px solid var(--line2);color:var(--txt);padding:11px 17px;
    border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.show{opacity:1;bottom:108px}
  datalist{display:none}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tiny{font-size:11px;color:var(--muted2);text-align:center;padding:14px 0 4px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Poké<span>Alpha</span> CRM</h1>
    <div style="display:flex;flex-direction:column;align-items:flex-end">
      <div class="tabtitle" id="tabTitle">Dashboard</div>
      <div class="sync-stat" id="syncStat" onclick="switchTab('data')">local only</div>
    </div>
  </header>

  <!-- DASHBOARD -->
  <section class="view active" id="view-dash"></section>
  <!-- PIPELINE -->
  <section class="view" id="view-pipe"></section>
  <!-- SOURCES -->
  <section class="view" id="view-src"></section>
  <!-- DATA -->
  <section class="view" id="view-data"></section>
  <!-- PSA PATHWAY -->
  <section class="view" id="view-psa"></section>
</div>

<button class="fab" id="fab" aria-label="Add item">+</button>

<nav class="bottom">
  <button class="on" data-tab="dash">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </button>
  <button data-tab="pipe">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Pipeline
  </button>
  <button data-tab="src">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
    Sources
  </button>
  <button data-tab="psa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 3-3"/></svg>
    P&L
  </button>
  <button data-tab="data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
    Data
  </button>
</nav>

<!-- ITEM EDITOR -->
<div class="overlay" id="ov-item"><div class="sheet" id="sheet-item"></div></div>
<!-- IMPORT REVIEW -->
<div class="overlay" id="ov-review"><div class="sheet" id="sheet-review"></div></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PokéAlpha CRM — unified buy + sell ledger
   Storage: pokealpha-crm-v1   |  Shares API key: pokealpha-apikey
   ============================================================ */
"use strict";

const DB_KEY = "pokealpha-crm-v1";
const KEY_KEY = "pokealpha-apikey";
const VISION_MODEL = "claude-sonnet-4-6";

/* ---- routes & statuses ---- */
const ROUTES = {
  probstein: { label: "Probstein consign", short: "Probstein" },
  grade:     { label: "Grade → sell",      short: "Grade" },
  direct:    { label: "Direct eBay / vault",short: "Direct" },
};
const STATUSES = {
  owned:    { label: "Owned",        badge: "b-owned",  chip: "Owned" },
  atpsa:    { label: "At PSA",       badge: "b-atpsa",  chip: "At PSA" },
  consign:  { label: "At Probstein", badge: "b-consign",chip: "At Probstein" },
  listed:   { label: "Listed",       badge: "b-listed", chip: "Listed" },
  sold:     { label: "Sold",         badge: "b-sold",   chip: "Sold" },
};

/* ---- grading cost model (mirrors the PokéAuction Scanner) ----
   bulk rate, or express when card value > threshold, plus shipping.
   Editable in the Data tab; stored under pokealpha-crm-grading. */
const GRADING_KEY = "pokealpha-crm-grading";
const GRADING_DEFAULTS = { bulk:50, express:70, threshold:500, shipping:2 };
function gradingCfg(){
  try{ const r = localStorage.getItem(GRADING_KEY); if(r) return Object.assign({},GRADING_DEFAULTS,JSON.parse(r)); }catch(e){}
  return Object.assign({}, GRADING_DEFAULTS);
}
function gradingEstimate(value){
  const g = gradingCfg();
  const base = num(value) > num(g.threshold) ? num(g.express) : num(g.bulk);
  return Math.round((base + num(g.shipping)) * 100) / 100;
}

/* ---- state ---- */
let state = { items: [] };
let dashFilter = "all";
let pipeFilter = "all";
let dashSort = "recent";   // recent · value · profit · roi · days · name
let dashQuery = "";        // dashboard search text
let editingId = null;
let pendingPhoto = null;     // base64 of photo in the open editor
let reviewItems = [];        // parsed import items awaiting confirm

/* ---- persistence ---- */
function load(){
  try{ const r = localStorage.getItem(DB_KEY); if(r){ state = JSON.parse(r); } }
  catch(e){ console.error("load failed", e); }
  if(!Array.isArray(state.items)) state.items = [];
}
function persistLocal(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); }
  catch(e){ toast("⚠️ Save failed — storage may be full"); console.error(e); }
}
function save(){
  state.updatedAt = Date.now();
  persistLocal();
  if(typeof schedulePush==="function") schedulePush();   // push to GitHub if sync is on
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---- money / math helpers ---- */
function num(v){
  if(typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v==null ? "" : v).trim();
  if(/%/.test(s)) return 0;                 // a percentage (e.g. a Probstein rate) is never a dollar amount
  s = s.replace(/[^0-9.\-]/g, "");          // strip $, commas, spaces, etc. so "$9,975.00" -> 9975
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
function money(v){
  const n = num(v); const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
}
function money2(v){
  const n = num(v); const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function pct(v){ const n = num(v); return (n>0?"+":"") + n.toFixed(1) + "%"; }

// business rule (carried over from consign tracker): sold ONLY if salePrice > 0
function isSold(it){ return num(it.salePrice) > 0; }
function isCard(it){ return it.kind !== "grading"; }   // grading purchases tracked separately
function costBasis(it){ return num(it.purchasePrice) + num(it.gradingCost) + num(it.fees); }
function netProfit(it){ return isSold(it) ? num(it.salePrice) - costBasis(it) : 0; }
function daysHeld(it){
  if(!it.purchaseDate) return null;
  const end = isSold(it) && it.saleDate ? new Date(it.saleDate) : new Date();
  const start = new Date(it.purchaseDate);
  if(isNaN(start) || isNaN(end)) return null;
  return Math.max(0, Math.round((end - start)/86400000));
}
function statusOf(it){
  if(isSold(it)) return "sold";
  return it.status && STATUSES[it.status] ? it.status : "owned";
}

/* ---- toast ---- */
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---- escape ---- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================================================
   RENDER: DASHBOARD
   ============================================================ */
function renderDash(){
  const v = document.getElementById("view-dash");
  const items = state.items;
  const cards = items.filter(isCard);
  const grading = items.filter(it=>!isCard(it));
  const gradingFolded = cards.reduce((a,it)=>a+num(it.gradingCost),0);
  const gradingStandalone = grading.reduce((a,it)=>a+num(it.purchasePrice),0);
  const gradingSpend = gradingFolded + gradingStandalone;
  const gradingCount = cards.filter(it=>num(it.gradingCost)>0).length + grading.length;
  const sold = cards.filter(isSold);
  const pending = cards.filter(it=>!isSold(it));

  const realized = sold.reduce((a,it)=>a+netProfit(it),0);
  const soldCost = sold.reduce((a,it)=>a+costBasis(it),0);
  const soldRev  = sold.reduce((a,it)=>a+num(it.salePrice),0);

  const inFlight = pending.reduce((a,it)=>a+costBasis(it),0);

  // filter chips counts (cards only; grading shown separately)

      </div>
      <div class="stat">

        <div class="val neu">${money(inFlight)}</div>
        <div class="sub">${pending.length} item${pending.length===1?'':'s'} unsold</div>
      </div>
      <div class="stat">

        <div class="val ${roi>0?'pos':roi<0?'neg':'neu'}">${soldCost>0?pct(roi):'—'}</div>

function chip(val,label,n,active,kind){
  return `<button class="chip ${active===val?'on':''}" onclick="setFilter('${kind}','${val}')">${esc(label)}<span class="n">${n}</span></button>`;
}
function setFilter(kind,val){
  if(kind==="dash"){ dashFilter=val; renderDash(); }
  else { pipeFilter=val; renderPipe(); }
}
function setDashSort(val){ dashSort = val; renderDash(); }
function sortOption(val,label){ return `<option value="${val}" ${dashSort===val?'selected':''}>${label}</option>`; }

// dashboard search: every whitespace-separated word must appear somewhere in the row
function matchQuery(it, q){
  if(!q || !q.trim()) return true;
  const hay = [it.name, it.set, it.source, it.cardNum, it.gradeCo, it.grade,
    (STATUSES[statusOf(it)]||{}).label, (ROUTES[it.route]||{}).short].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=> hay.includes(w));
}
// builds the dashboard card list honoring status filter + search + sort
function dashListHTML(){
  const cards = state.items.filter(isCard);
  let shown = cards.slice();
  if(dashFilter!=="all") shown = shown.filter(it=>statusOf(it)===dashFilter);
  shown = shown.filter(it=> matchQuery(it, dashQuery));
  sortItems(shown, dashSort);
  if(shown.length) return shown.map(itemRow).join("");
  return `<div class="empty"><div class="big">${dashQuery?'🔎':'📭'}</div>${
    dashQuery ? 'No cards match “'+esc(dashQuery)+'”.'
    : (cards.length ? 'No cards in this filter.' : 'No items yet. Tap <b>+</b> to add one, or go to <b>Data</b> to import.')
  }</div>`;
}
// keystroke handler — only refreshes the list so the search box keeps focus
function onDashSearch(q){
  dashQuery = q;
  const el = document.getElementById("dashList");
  if(el) el.innerHTML = dashListHTML();
}

// dollar figure shown on a row: realized net for sold, cost basis for unsold
function rowValue(it){ return isSold(it) ? num(it.salePrice) : costBasis(it); }
function rowROI(it){ const c=costBasis(it); return (isSold(it) && c>0) ? netProfit(it)/c : -Infinity; }
function sortItems(arr, mode){
  const byDate = (a,b)=> new Date(b.saleDate||b.purchaseDate||0) - new Date(a.saleDate||a.purchaseDate||0);
  const cmp = {
    recent: byDate,
    value:  (a,b)=> rowValue(b)-rowValue(a) || byDate(a,b),
    profit: (a,b)=> netProfit(b)-netProfit(a) || rowValue(b)-rowValue(a),
    roi:    (a,b)=> rowROI(b)-rowROI(a) || byDate(a,b),
    days:   (a,b)=> (daysHeld(b)??-1)-(daysHeld(a)??-1) || byDate(a,b),
    name:   (a,b)=> String(a.name||"").localeCompare(String(b.name||""), undefined, {sensitivity:"base"})
  }[mode] || byDate;
  arr.sort(cmp);
  return arr;
}

function itemRow(it){
  const g = !isCard(it);
  const st = statusOf(it);
  const np = netProfit(it);
  const sold = isSold(it);
  const badge = g ? `<span class="badge b-listed">Grading</span>` : `<span class="badge ${STATUSES[st].badge}">${STATUSES[st].label}</span>`;
  const right = (sold && !g)
    ? `<div class="pnl ${np>0?'pos':np<0?'neg':'neu'}">${money(np)}</div>${badge}`
    : `<div class="pnl neu mono">${money(g?num(it.purchasePrice):costBasis(it))}</div>${badge}`;
  const grade = it.grade ? `${esc(it.gradeCo||'')} ${esc(it.grade)}`.trim() : '';
  const metaParts = [grade, it.set, it.source].filter(Boolean).map(esc);
  return `
    <div class="item" onclick="openItem('${it.id}')">
      ${ it.photo ? `<img class="thumb" src="${it.photo}" alt=""/>` : `<div class="thumb">🃏</div>` }
      <div class="body">
        <div class="nm">${esc(it.name||'Untitled card')}</div>
        <div class="meta">${metaParts.join(' · ')||'—'}</div>
        <div class="route-tag">${ROUTES[it.route]?ROUTES[it.route].short:''}${it.cardNum?' · #'+esc(it.cardNum):''}</div>
      </div>
      <div class="right">${right}</div>
    </div>`;
}

/* ============================================================
   RENDER: PIPELINE (grouped by status)
   ============================================================ */
function renderPipe(){
  const v = document.getElementById("view-pipe");
  const items = state.items.filter(isCard);
  const counts = { all: items.length };
  Object.keys(STATUSES).forEach(s=> counts[s] = items.filter(it=>statusOf(it)===s).length);

  const order = ["owned","atpsa","consign","listed","sold"];
  let html = `<div class="chips">
      ${chip("all","All",counts.all,pipeFilter,"pipe")}
      ${order.map(s=>chip(s,STATUSES[s].chip,counts[s],pipeFilter,"pipe")).join("")}
    </div>`;

  const groups = pipeFilter==="all" ? order : [pipeFilter];
  let any = false;
  groups.forEach(s=>{
    const rows = items.filter(it=>statusOf(it)===s)
      .sort((a,b)=> new Date(b.saleDate||b.purchaseDate||0) - new Date(a.saleDate||a.purchaseDate||0));
    if(!rows.length) return;
    any = true;
    const cap = rows.reduce((a,it)=> a + (s==="sold"?netProfit(it):costBasis(it)), 0);
    html += `<div class="section-h">${STATUSES[s].label} <span style="color:var(--muted2)">· ${rows.length} · ${s==="sold"?'P&L ':''}${money(cap)}</span></div>`;
    html += `<div class="list">${rows.map(itemRow).join("")}</div>`;
  });
  if(!any) html += `<div class="empty"><div class="big">🗂️</div>Nothing here yet.</div>`;
  v.innerHTML = html;
}

/* ============================================================
   RENDER: SOURCES (per-source P&L + ROI)
   ============================================================ */
function renderSrc(){
  const v = document.getElementById("view-src");
  const map = {};
  state.items.filter(isCard).forEach(it=>{
    const k = (it.source||"").trim() || "Unknown";
    if(!map[k]) map[k] = { name:k, items:0, sold:0, invested:0, soldCost:0, realized:0, inFlight:0 };
    const g = map[k];
    g.items++; g.invested += costBasis(it);
    if(isSold(it)){ g.sold++; g.soldCost += costBasis(it); g.realized += netProfit(it); }
    else { g.inFlight += costBasis(it); }
  });
  const groups = Object.values(map).sort((a,b)=> b.realized - a.realized);
  const maxAbs = Math.max(1, ...groups.map(g=>Math.abs(g.realized)));

  if(!groups.length){ v.innerHTML = `<div class="empty"><div class="big">📊</div>No sources yet.</div>`; return; }

  v.innerHTML = `<div class="section-h">By source · realized P&amp;L <span style="color:var(--muted2);font-weight:600">· tap for details</span></div>` + groups.map(g=>{
    const roi = g.soldCost>0 ? g.realized/g.soldCost*100 : 0;
    const w = Math.abs(g.realized)/maxAbs*100;
    return `<div class="src" style="cursor:pointer" onclick="openSeller(decodeURIComponent('${encodeURIComponent(g.name)}'))">
      <div class="top">
        <div class="name">${esc(g.name)}</div>
        <div class="roi ${g.realized>0?'pos':g.realized<0?'neg':'neu'}">${money(g.realized)}</div>
      </div>
      <div class="grid">
        <div class="g"><div class="l">ROI</div><div class="v ${roi>0?'pos':roi<0?'neg':'neu'}">${g.soldCost>0?pct(roi):'—'}</div></div>
        <div class="g"><div class="l">Sold</div><div class="v">${g.sold}/${g.items}</div></div>
        <div class="g"><div class="l">In flight</div><div class="v mono">${money(g.inFlight)}</div></div>
      </div>
      <div class="bar"><i style="width:${w}%;background:${g.realized<0?'var(--red)':'var(--green)'}"></i></div>
    </div>`;
  }).join("");
}

// Seller detail: live P&L + every card purchased from this source.
function openSeller(name){
  const items = state.items.filter(it=> isCard(it) && (((it.source||"").trim())||"Unknown")===name);

  const realized = sold.reduce((a,it)=>a+netProfit(it),0);
  const soldCost = sold.reduce((a,it)=>a+costBasis(it),0);
  const soldRev  = sold.reduce((a,it)=>a+num(it.salePrice),0);
  const inFlight = pending.reduce((a,it)=>a+costBasis(it),0);
  const roi = soldCost>0 ? realized/soldCost*100 : 0;
  const rows = items.slice(); sortItems(rows, "value");
  const sheet = document.getElementById("sheet-review");
  sheet.innerHTML = `
    <div class="grab"></div>

    <p class="sub">${items.length} card${items.length===1?'':'s'} · ${sold.length} sold · ${money(invested)} invested</p>
    <div class="stats" style="margin-bottom:12px">
      <div class="stat"><div class="lbl">Realized P&amp;L</div><div class="val ${realized>0?'pos':realized<0?'neg':'neu'}">${money(realized)}</div><div class="sub">${money(soldRev)} from ${sold.length} sold</div></div>
      <div class="stat"><div class="lbl">Realized ROI</div><div class="val ${roi>0?'pos':roi<0?'neg':'neu'}">${soldCost>0?pct(roi):'—'}</div><div class="sub">on ${money(soldCost)} cost</div></div>
      <div class="stat"><div class="lbl">Capital in flight</div><div class="val neu">${money(inFlight)}</div><div class="sub">${pending.length} unsold</div></div>
      <div class="stat"><div class="lbl">Total invested</div><div class="val neu">${money(invested)}</div><div class="sub">${items.length} card${items.length===1?'':'s'}</div></div>

    <div class="list">${rows.map(itemRow).join("")}</div>

    <button class="btn sec sm" onclick="closeReview()">Close</button>
  `;
  document.getElementById("ov-review").classList.add("open");
  document.body.style.overflow="hidden";
}

// Closest thing to "share from Photos" on iPhone: copy a photo, then paste it here.
async function pastePhotoToEditor(){
  if(!navigator.clipboard || !navigator.clipboard.read){ toast("Paste not supported on this browser"); return; }
  try{
    const items = await navigator.clipboard.read();
    for(const item of items){
      const type = item.types.find(t=>t.startsWith("image/"));
      if(type){
        const blob = await item.getType(type);
        pendingPhoto = await resizeImage(blob);
        renderPhotoArea();
        toast("Photo pasted ✓");
        return;
      }
    }
    toast("No image copied — copy a photo in Photos first");
  }catch(e){ console.error(e); toast("Tap Paste again & allow access"); }
}

function recalc(){
  const box = document.getElementById("pnlBox");

  const g = id=>num((document.getElementById(id)||{}).value);
  const cost = g("f-purchasePrice"), grad = g("f-gradingCost"), fee = g("f-fees"), sale = g("f-salePrice");
  const basis = cost+grad+fee;
  const sold = sale>0;
  const np = sold ? sale - basis : 0;
  box.innerHTML = `
    <div class="r"><span class="k">Cost basis</span><span class="mono">${money2(basis)}</span></div>
    ${sold?`<div class="r"><span class="k">Sale (net)</span><span class="mono">${money2(sale)}</span></div>
    <div class="r tot"><span>Net profit</span><span class="mono ${np>0?'pos':np<0?'neg':'neu'}">${money2(np)}</span></div>`

}

async function resizeImage(file, max=512, q=0.7){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width:w, height:h} = img;
      if(w>h && w>max){ h = h*max/w; w = max; }
      else if(h>max){ w = w*max/h; h = max; }
      const c = document.createElement("canvas");
      c.width = Math.round(w); c.height = Math.round(h);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", q));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src = url;
  });
}

async function visionParse(dataUrl){
  const key = localStorage.getItem(KEY_KEY);
  if(!key) throw new Error("no key");
  const b64 = dataUrl.split(",")[1];
  const media = dataUrl.substring(5, dataUrl.indexOf(";"));
  const body = {
    model: VISION_MODEL, max_tokens: 400,
    messages: [{ role:"user", content:[
      { type:"image", source:{ type:"base64", media_type:media, data:b64 } },
      { type:"text", text:'This is a graded Pokémon card slab (PSA/CGC/BGS) or a raw card. Read the label and return ONLY a JSON object, no prose, with keys: name (card/pokemon name), set, cardNum, gradeCo (PSA/CGC/BGS/SGC), grade (number), cert (cert/serial number). Use empty string for anything not visible.' }
    ]}]
  };
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t=await res.text(); throw new Error("API "+res.status+": "+t.slice(0,120)); }
  const j = await res.json();
  const txt = (j.content||[]).map(c=>c.text||"").join("");
  const m = txt.match(/\{[\s\S]*\}/);
  if(!m) throw new Error("no JSON in response");
  return JSON.parse(m[0]);
}

// Turn a raw API error into a plain-English hint so failures aren't all blamed on the key.
function apiErrHint(e){
  const m = String((e&&e.message)||e||"");
  if(/401|authentication|invalid x-api-key/i.test(m)) return "API key rejected (401). Re-paste a valid key.";
  if(/404|not_found|model:/i.test(m))               return "model unavailable (404) — app needs a newer model name.";
  if(/429|rate_?limit/i.test(m))                    return "rate limited (429). Wait a few seconds and retry.";
  if(/credit|billing|payment|low/i.test(m))         return "out of API credits — check billing at console.anthropic.com.";
  if(/Failed to fetch|NetworkError|CORS/i.test(m))  return "network/connection blocked.";
  return (m.slice(0,90) || "unknown error");
}
async function scanLabel(){
  const btn = document.getElementById("scanBtn");
  if(!pendingPhoto) return;
  const old = btn.innerHTML; btn.innerHTML = `<span class="spin"></span> Reading label…`; btn.disabled=true;
  try{
    const d = await visionParse(pendingPhoto);
    const setv=(id,val)=>{ const el=document.getElementById(id); if(el&&val) el.value=val; };
    setv("f-name",d.name); setv("f-set",d.set); setv("f-cardNum",d.cardNum);
    setv("f-grade",d.grade); setv("f-cert",d.cert);
    if(d.gradeCo){ const el=document.getElementById("f-gradeCo"); if(el) el.value = d.gradeCo; }
    toast("Label read ✓");
  }catch(e){
    console.error(e); toast("Scan failed — "+apiErrHint(e));
  }finally{ btn.innerHTML=old; btn.disabled=false; }
}

function pickField(obj, names){
  const lower = {}; Object.keys(obj).forEach(k=> lower[k.toLowerCase().replace(/[^a-z0-9]/g,"")]=obj[k]);
  for(const n of names){ const key=n.toLowerCase().replace(/[^a-z0-9]/g,""); if(lower[key]!=null && lower[key]!=="") return lower[key]; }
  return "";
}
function mapImported(o){
  const it = blankItem();
  it.id = uid(); it.created = Date.now();
  it.name        = String(pickField(o,["name","title","card","cardname","pokemon"])||"");
  it.set         = String(pickField(o,["set","setname","series"])||"");
  it.cardNum     = String(pickField(o,["cardnum","cardnumber","number","cardno","num","#"])||"");
  it.gradeCo     = String(pickField(o,["gradeco","grader","gradingcompany","company","tgc"])||"");
  it.grade       = String(pickField(o,["grade","psagrade"])||"");
  it.cert        = String(pickField(o,["cert","certnumber","certno","serial","certification"])||"");
  it.source      = String(pickField(o,["source","supplier","boughtfrom","origin","sourcename"])||"");
  it.purchasePrice = String(pickField(o,["purchaseprice","inputprice","cost","costbasis","buyprice","paid","price","input"])||"");
  it.purchaseDate  = normDate(pickField(o,["purchasedate","dateacquired","acquireddate","acquired","buydate","datebought","date"]));
  it.orderNum    = String(pickField(o,["ordernum","ordernumber","order","orderid","ref","reference"])||"");
  it.gradingCost = String(pickField(o,["gradingcost","gradecost","gradingfee"])||"");
  it.fees        = String(pickField(o,["fees","fee","shipping","othercosts","extracost"])||"");
  it.predictedSale = String(pickField(o,["predictedsale","predicted","estsale","estimate"])||"");
  it.salePrice   = String(pickField(o,["salePrice","saleprice","soldprice","sold","sale","netsale","salenet"])||"");
  it.saleDate    = normDate(pickField(o,["saledate","solddate","datesold","dateSold"]));
  it.saleVenue   = String(pickField(o,["salevenue","venue","soldon","saleplatform","platform"])||"");
  it.notes       = String(pickField(o,["notes","note","comment","comments"])||"");
  const kindRaw  = String(pickField(o,["kind","type","category"])||"").toLowerCase();
  it.kind = (/psa grading|cgc grading|grading\s*-/i.test(it.name) || kindRaw==="grading") ? "grading" : "card";
  const photo    = pickField(o,["photo","image","img","picture","thumbnail"]);
  if(photo && String(photo).startsWith("data:")) it.photo = photo;
  // route + status best-effort
  const rRaw = String(pickField(o,["route","path","channel"])||"").toLowerCase();
  if(rRaw.includes("grad")) it.route="grade"; else if(rRaw.includes("direct")||rRaw.includes("ebay")||rRaw.includes("vault")) it.route="direct"; else it.route="probstein";
  if(num(it.salePrice)>0) it.status="sold";
  else {
    const sRaw = String(pickField(o,["status","stage","state"])||"").toLowerCase();
    if(sRaw.includes("psa")||sRaw.includes("grad")) it.status="atpsa";
    else if(sRaw.includes("probstein")||sRaw.includes("consign")) it.status="consign";
    else if(sRaw.includes("list")) it.status="listed";
    else it.status="owned";
  }
  return it;
}
function normDate(v){
  if(!v) return "";
  if(typeof v==="number"){ const d=new Date(v); return isNaN(d)?"":d.toISOString().slice(0,10); }
  const s=String(v).trim();
  // already yyyy-mm-dd
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  // mm/dd/yyyy
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y="20"+y; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; }
  const d=new Date(s); return isNaN(d)?"":d.toISOString().slice(0,10);
}

function handleJSONFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      let data = JSON.parse(r.result);
      let arr = Array.isArray(data) ? data
        : Array.isArray(data.items) ? data.items
        : Array.isArray(data.slabs) ? data.slabs
        : Array.isArray(data.cards) ? data.cards
        : Array.isArray(data.data) ? data.data : null;
      if(!arr){ toast("Couldn't find a list in that JSON"); return; }
      reviewItems = arr.map(mapImported);
      openReview("Imported "+reviewItems.length+" from JSON");
    }catch(e){ console.error(e); toast("Invalid JSON file"); }
  };
  r.readAsText(file);
}

   ============================================================ */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], nx=text[i+1];
    if(q){
      if(c==='"'&&nx==='"'){ cur+='"'; i++; }
      else if(c==='"'){ q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==='\r'){ /* skip */ }
      else cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=> r.some(c=>String(c).trim()!==""));
}
function handleCSVFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const rows = parseCSV(r.result);
      if(rows.length<2){ toast("CSV needs a header + at least one row"); return; }
      const headers = rows[0];
      const objs = rows.slice(1).map(cells=>{
        const o={}; headers.forEach((h,i)=> o[h.trim()] = cells[i]!=null?cells[i].trim():""); return o;
      });
      reviewItems = objs.map(mapImported);
      openReview("Parsed "+reviewItems.length+" rows from CSV");
    }catch(e){ console.error(e); toast("Couldn't parse that CSV"); }
  };
  r.readAsText(file);
}

/* ============================================================
   IMPORT — eBay purchase history paste
   ============================================================ */
// Deterministic parser for eBay "Purchase history" copied as markdown/text.
// Anchors on the reliable trio: "US $<price>" → "Sold by:" → seller link.
// The card/grading title is the line immediately above the price.
const GRADE_IN_TITLE = /\b(PSA|BGS|BVG|CGC|SGC|TAG|ACE)\s*([0-9]{1,2}(?:\.[0-9])?)\b/i;
const GRADING_TITLE  = /psa grading|cgc grading|bgs grading|grading\s*[-–]|grading service|^grading\b/i;

function parseEbayMarkdown(raw){
  const lines = raw.split("\n");
  const out = [];
  let curDate = "", curNum = "", curPo = "";
  const dateRe  = /Order date:\s*([A-Z][a-z]{2,8}\s+\d{1,2},\s*\d{4})/;
  const numRe   = /Order number:\s*([0-9][0-9\-]{6,})/;
  const poRe    = /purchaseOrderId=([0-9][0-9\-]+)/;
  const priceRe = /^US\s*\$\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)\s*$/;
  const usrRe   = /\]\(https:\/\/www\.ebay\.com\/usr\/([^)\/?]+)/;
  const itmRe   = /^\[(.+?)\]\(https:\/\/www\.ebay\.com\/itm\//;

  for(let i=0;i<lines.length;i++){
    const ln = lines[i].trim();
    const dm = ln.match(dateRe); if(dm) curDate = normDate(dm[1]);
    const nm = ln.match(numRe);  if(nm) curNum  = nm[1];
    const po = ln.match(poRe);   if(po) curPo   = po[1];   // shared across a checkout

    const pm = ln.match(priceRe);
    if(!pm) continue;
    const next1 = (lines[i+1]||"").trim();
    const next2 = (lines[i+2]||"").trim();
    if(!/^Sold by:?$/i.test(next1)) continue;   // not a real purchase line
    // seller: from a usr link, or from plain text like "probstein123user ID"
    let seller = "eBay";
    const sm = next2.match(usrRe);
    if(sm) seller = sm[1];
    else { const sp = next2.match(/^\[?\s*(.+?)\s*user ID\b/i); if(sp) seller = sp[1].replace(/^\[/,"").trim(); }

    // title = nearest non-empty line above the price
    let title = "";
    for(let k=i-1;k>=0 && k>i-4;k--){
      const pv = (lines[k]||"").trim();
      if(!pv) continue;
      const im = pv.match(itmRe);
      title = im ? im[1].trim() : pv.replace(/^\[/,"").replace(/\]\(.*$/,"").trim();
      break;
    }
    out.push({ title, price: pm[1].replace(/,/g,""), seller, orderDate: curDate, orderNum: curNum, poId: curPo });
  }
  // dedupe ONLY real duplicates (same title+price+order#). Never collapse items
  // that lack an order number — e.g. several identical grading purchases.
  const seen = new Set(), uniq = [];
  for(const o of out){
    const k = o.title+"|"+o.price+"|"+o.orderNum;
    if(o.orderNum && seen.has(k)) continue;
    if(o.orderNum) seen.add(k);
    uniq.push(o);
  }
  return uniq;
}

function cleanTitle(t){ return String(t||"").replace(/�/g,"").replace(/\s{2,}/g," ").trim().slice(0,160); }

function finalizeCardRec(o){
  const it = blankItem();
  it.id=uid(); it.created=Date.now(); it.kind="card";
  it.name = cleanTitle(o.title);
  it.purchasePrice = o.price||"";
  it.purchaseDate = o.orderDate||"";
  it.orderNum = o.orderNum||"";
  it.source = o.seller||"eBay";
  it.route = "probstein"; it.status = "owned";
  const gm = (o.title||"").match(GRADE_IN_TITLE);     // already-graded slab → fill grade, no grading cost
  if(gm){ it.gradeCo = gm[1].toUpperCase(); it.grade = gm[2]; }
  return it;
}
function finalizeGradingRec(o){
  const it = blankItem();
  it.id=uid(); it.created=Date.now(); it.kind="grading";
  it.name = cleanTitle(o.title);
  it.purchasePrice = o.price||"";
  it.purchaseDate = o.orderDate||"";
  it.orderNum = o.orderNum||"";
  it.source = o.seller||"eBay";
  it.route = "grade"; it.status = "owned";
  return it;
}

// Match each grading purchase to the RAW card it paid for, then fold the fee
// into that card's cost basis and mark it "At PSA". Two signals, in priority:
//   1) shared checkout — purchaseOrderId, or the order-number prefix (18-14677-…)
//   2) adjacency — eBay lists the grading line item right next to its card
// Pre-graded slabs (PSA 10, BGS 8.5 …) never receive grading. Anything left
// unmatched stays as its own grading entry so the cost isn't lost.
function buildItemsFromEbay(parsed){
  const recs = parsed.map((o,idx)=>({
    ...o, idx,
    isGrading: GRADING_TITLE.test(o.title||""),
    isRaw: !GRADING_TITLE.test(o.title||"") && !GRADE_IN_TITLE.test(o.title||"")
  }));
  const cardFee = {};                 // card idx → grading fee
  const used = new Set();              // grading idxs that have been folded in
  const assign = (g,c)=>{ if(cardFee[c.idx]!=null) return false; cardFee[c.idx]=num(g.price); used.add(g.idx); return true; };

  // PASS 1 — group by shared checkout (purchaseOrderId, else order-number prefix)
  const keyOf = r => r.poId ? ("po:"+r.poId)
    : (r.orderNum && r.orderNum.split("-").length>=2 ? "on:"+r.orderNum.split("-").slice(0,2).join("-") : null);
  const groups = new Map();
  recs.forEach(r=>{ const k=keyOf(r); if(!k) return; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
  for(const grp of groups.values()){
    const gradings = grp.filter(r=>r.isGrading);
    const rawCards = grp.filter(r=>r.isRaw);
    let gi=0;
    for(const c of rawCards){ while(gi<gradings.length && used.has(gradings[gi].idx)) gi++; if(gi>=gradings.length) break; assign(gradings[gi], c); gi++; }
  }

  // PASS 2 — adjacency for any grading still unmatched (covers pastes with no order #s)
  for(const g of recs){
    if(!g.isGrading || used.has(g.idx)) continue;
    let target=null;
    for(let d=1; d<=3 && !target; d++){
      const nxt=recs[g.idx+d], prv=recs[g.idx-d];
      if(nxt && nxt.isRaw && cardFee[nxt.idx]==null) target=nxt;
      else if(prv && prv.isRaw && cardFee[prv.idx]==null) target=prv;
    }
    if(target) assign(g, target);
  }

  // build
  const items=[];
  for(const r of recs){
    if(r.isGrading){
      if(used.has(r.idx)) continue;                 // folded into a card
      items.push(finalizeGradingRec(r));            // genuinely unmatched
    } else {
      const it = finalizeCardRec(r);
      if(cardFee[r.idx]!=null){ it.gradingCost = String(cardFee[r.idx]); it.status = "atpsa"; }
      items.push(it);
    }
  }
  return items;
}

// Smart parse — sends the pasted text to Claude (the way the scanner's
// /api/purchases/parse did). Falls back to the offline regex parser when
// there's no API key or the call fails.
async function parsePurchasesAI(text){
  const key = localStorage.getItem(KEY_KEY);
  if(!key) throw new Error("no key");
  const body = {
    model: VISION_MODEL, max_tokens: 3000,
    messages: [{ role:"user", content:[{ type:"text", text:
      'Below is pasted text from an eBay "Purchase history" page. Extract EVERY purchased item. '+
      'Return ONLY a JSON array — no prose, no markdown fences. Each element must be: '+
      '{"name":"full item title","purchasePrice":"123.45","purchaseDate":"YYYY-MM-DD","orderNum":"order number","source":"seller username"}. '+
      'Rules: purchasePrice is digits and a decimal point only (strip $ and commas; if a range or multiple, use the total paid). '+
      'purchaseDate in YYYY-MM-DD, or "" if not determinable. orderNum "" if absent. source = the seller username if shown, else "eBay". '+
      'Ignore navigation, buttons, shipping/feedback lines. One object per purchased item.\n\n----- PASTE -----\n'+ text
    }]}]
  };
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify(body)
  });
  if(!res.ok){ const t=await res.text(); throw new Error("API "+res.status+": "+t.slice(0,140)); }
  const j = await res.json();
  const txt = (j.content||[]).map(c=>c.text||"").join("");
  const m = txt.match(/\[[\s\S]*\]/);
  if(!m) throw new Error("no JSON array in response");
  return JSON.parse(m[0]);
}

// Every item imported from an eBay paste is attributed to a single seller,

function unifyEbaySeller(items){

  return items;
}

function parseEbayRegex(raw){
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const items = [];
  let cur = null;
  // a price line must carry a $ and cents — avoids matching quantities/ids/dates
  const priceRe   = /^(?:US\s*)?\$\s*([0-9][0-9,]*\.[0-9]{2})$/;
  const inlinePrice = /\$\s*([0-9][0-9,]*\.[0-9]{2})/;
  const orderRe   = /order\s*(?:number|#|no\.?)?\s*[:#]?\s*([0-9][0-9\-]{6,})/i;
  // a standalone date header (eBay groups purchases under these) → block separator
  const dateOnly  = /^(?:[A-Z][a-z]{2,8}\s+\d{1,2},?\s+\d{4}|\d{1,2}\/\d{1,2}\/\d{2,4})$/;
  const noise = /^(purchase history|past purchases|orders?|view order details|leave feedback|sold by.*|returns?(?:\s+eligible)?|track package|buy it again|delivered.*|shipped.*|order details|qty.*|quantity.*|condition.*|more actions|seller information|item id.*|status.*)$/i;

  const ensure = ()=>{ if(!cur) cur={}; return cur; };
  function flush(){ if(cur && (cur.name || cur.purchasePrice)) items.push(finalizeEbay(cur)); cur=null; }

  for(const ln of lines){
    if(dateOnly.test(ln)){ flush(); ensure().purchaseDate = normDate(ln); continue; }
    const om = ln.match(orderRe);
    if(om){ ensure().orderNum = om[1]; flush(); continue; }   // order # ends a block
    if(noise.test(ln)) continue;
    const pm = ln.match(priceRe);
    if(pm){ ensure(); if(!cur.purchasePrice) cur.purchasePrice = pm[1].replace(/,/g,""); continue; }
    // title candidate
    if(ln.length>=8 && !/^\d+$/.test(ln)){
      ensure();
      if(!cur.name) cur.name = ln.replace(inlinePrice,"").trim();
      const ip = ln.match(inlinePrice);
      if(ip && !cur.purchasePrice) cur.purchasePrice = ip[1].replace(/,/g,"");
    }
  }
  flush();
  return items;
}
function finalizeEbay(c){
  const it = blankItem();
  it.id=uid(); it.created=Date.now();
  it.name = (c.name||"").slice(0,140);
  it.purchasePrice = c.purchasePrice||"";
  it.purchaseDate = c.purchaseDate||"";
  it.orderNum = c.orderNum||"";
  it.source = "eBay";
  it.route = "probstein"; it.status="owned";
  return it;
}

/* ============================================================
   IMPORT — Probstein consignment payout → match to owned cards
   Updates EXISTING unsold cards (sets salePrice = net payout, status sold)
   rather than creating new items.
   ============================================================ */
let probMatches = [];   // [{desc, gross, net, cardId, conf}]
const PROB_STOP = new Set(["pokemon","pokémon","card","cards","tcg","the","and","for","with","holo","rare","mint","near","graded","grade","slab","auction","lot"]);

function probTokens(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").split(" ")
    .filter(t=> t.length>=3 && !PROB_STOP.has(t));
}
function tokWeight(t){ return /^\d{4}$/.test(t) ? 3 : (t.length>=7 ? 2 : 1); }

// similarity 0..1 between a payout description and a card record
function probScore(desc, card){
  const a = new Set(probTokens(desc));
  const cardText = [card.name, card.set, card.cardNum, card.gradeCo, card.grade].join(" ");
  const b = probTokens(cardText);
  if(!a.size || !b.length) return 0;
  let hit=0, wsum=0; const counted=new Set();
  for(const t of b){ wsum += tokWeight(t); if(a.has(t) && !counted.has(t)){ hit += tokWeight(t); counted.add(t); } }
  let aw=0, ah=0;
  for(const t of a){ aw += tokWeight(t); if(b.includes(t)) ah += tokWeight(t); }
  return (hit/Math.max(1,wsum))*0.5 + (ah/Math.max(1,aw))*0.5;
}

// pull payout rows out of pasted statement text (tab, multi-space, comma, or single blob)
function parseProbRows(raw){
  const out=[];
  raw.split("\n").forEach(line=>{
    const ln = line.trim();
    if(!ln) return;
    if(/^description\b/i.test(ln)) return;
    if(/^total items/i.test(ln)) return;
    if(/gross sales|net sales|net payment/i.test(ln)) return;
    if(/probstein|cash advances|ebay partner|affiliate/i.test(ln)) return;
    let cells = ln.includes("\t") ? ln.split("\t") : (/\s{2,}/.test(ln) ? ln.split(/\s{2,}/) : ln.split(","));
    cells = cells.map(c=>c.trim()).filter(c=>c!=="");
    if(cells.length>=2){
      const desc = cells[0];
      const nums = cells.slice(1).map(num).filter(n=>!isNaN(n) && n>0);
      if(!desc || !/[a-z]/i.test(desc) || !nums.length) return;   // first cell must read as a title
      out.push({ desc, gross:nums[0], net:nums[nums.length-1] });
      return;
    }
    // single-blob fallback: peel the trailing run of number tokens off the end.
    // A Probstein line ends with up to 4 financials (gross, rate, fee, net); a
    // trailing grade number (e.g. "PSA 10") gets pulled in too, so when there
    // are more than 4 trailing numbers we keep only the last 4.
    const toks = ln.split(/\s+/);
    const isNumTok = t => /^\$?\d[\d,]*(?:\.\d+)?$/.test(t);
    let k = toks.length;
    while(k>0 && isNumTok(toks[k-1])) k--;
    const desc2 = toks.slice(0,k).join(" ").trim();
    let nums2 = toks.slice(k).map(num);   // keep all trailing tokens incl. a $0 fee
    if(!desc2 || !/[a-z]/i.test(desc2) || !nums2.length) return;
    if(nums2.length>4) nums2 = nums2.slice(-4);   // drop a glued trailing grade
    out.push({ desc:desc2, gross:nums2[0], net:nums2[nums2.length-1] });
  });
  return out;
}

// Conservative offline matcher: greedily assign best pairs (each card once),
// but only AUTO-pick when the score is high enough to be safe. Year/set overlap
// alone (e.g. two different 2007 Gold Stars) scores well under this bar, so
// near-misses are left for the user to pick manually rather than mis-marked.
function matchProbsteinRegex(sales, pool){
  const pairs=[];
  sales.forEach((s,si)=> pool.forEach(c=>{ const sc=probScore(s.desc,c); if(sc>0) pairs.push({si,cid:c.id,sc}); }));
  pairs.sort((x,y)=> y.sc - x.sc);
  const saleCard={}, saleConf={}, usedCard=new Set();
  for(const p of pairs){
    if(saleCard[p.si]!=null || usedCard.has(p.cid)) continue;
    if(p.sc < 0.7) continue;                 // only confident, same-card matches auto-pick
    saleCard[p.si]=p.cid; saleConf[p.si]=p.sc; usedCard.add(p.cid);
  }
  return sales.map((s,si)=>({ desc:s.desc, gross:s.gross, net:s.net, cardId: saleCard[si]||"", conf: saleConf[si]||0 }));
}

// Smart matcher: lets Claude pair each payout line to the SAME physical card —
// it understands that "Espeon Gold Star" ≠ "Vaporeon Gold Star" even though the
// year and set overlap. Falls back to the offline matcher when no key / failure.
async function matchProbsteinAI(sales, pool){
  const key = localStorage.getItem(KEY_KEY);
  if(!key) throw new Error("no key");
  const cardList = pool.map((c,i)=>({ i, name:c.name, set:c.set, num:c.cardNum, grade:(c.gradeCo+" "+c.grade).trim() }));
  const saleList = sales.map((s,i)=>({ i, title:s.desc }));
  const prompt =
    "Match a Pokémon card consignment payout to a person's owned-card inventory. "+
    "For EACH payout line, find the ONE owned card that is the SAME physical card — same Pokémon/character, same set, same year, and same grade/card number when shown. "+
    "Different Pokémon, different set, or different grade is NOT a match even if the year matches. "+
    "Return ONLY a JSON array, one element per payout line: "+
    '[{"sale":<saleIndex>,"card":<cardIndex or null>,"confidence":<0..1>}]. Use null for card when no owned card is clearly the same.\n\n'+
    "PAYOUT LINES:\n"+JSON.stringify(saleList)+"\n\nOWNED CARDS:\n"+JSON.stringify(cardList);
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:VISION_MODEL, max_tokens:1500, messages:[{ role:"user", content:[{ type:"text", text:prompt }] }] })
  });
  if(!res.ok){ const t=await res.text(); throw new Error("API "+res.status+": "+t.slice(0,120)); }
  const j = await res.json();
  const txt = (j.content||[]).map(c=>c.text||"").join("");
  const m = txt.match(/\[[\s\S]*\]/); if(!m) throw new Error("no JSON array in response");
  const arr = JSON.parse(m[0]);
  const out = sales.map(s=>({ desc:s.desc, gross:s.gross, net:s.net, cardId:"", conf:0 }));
  arr.forEach(r=>{
    if(r && r.sale!=null && out[r.sale] && r.card!=null && pool[r.card]){
      out[r.sale].cardId = pool[r.card].id;
      out[r.sale].conf = Number(r.confidence)||0.7;
    }
  });
  return out;
}

async function parseProbstein(){
  const raw = (document.getElementById("imp-prob").value||"").trim();
  if(!raw){ toast("Paste your Probstein statement first"); return; }
  const sales = parseProbRows(raw);

  const btn = document.getElementById("probBtn"); const key = localStorage.getItem(KEY_KEY);
  if(key && btn){
    const old = btn.innerHTML; btn.innerHTML = `<span class="spin"></span> Matching with Claude…`; btn.disabled = true;

    }catch(e){

    }

}

// Import a Probstein statement as a CSV file (e.g. exported from the spreadsheet).
// Auto-detects the Description and Net/Sales-price columns, then runs the same
// matcher as the paste path.
async function handleProbCSVFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const rows = parseCSV(r.result);
      if(!rows.length){ toast("That CSV looks empty"); return; }
      let start=0, di=0, ni=-1, gi=-1;
      // find the header row within the first several rows (statements often have a
      // title row, then a blank, then the real "Description … Net Price" header)
      let hdr = -1;
      for(let i=0;i<Math.min(rows.length,8);i++){
        const r = rows[i].map(c=>String(c).toLowerCase().trim());
        if(r.some(h=>/desc|item|card|name|title/.test(h)) && r.some(h=>/price|net|payout|gross|amount/.test(h))){ hdr=i; break; }
      }
      if(hdr>=0){
        const h = rows[hdr].map(c=>String(c).toLowerCase().trim());
        const find = re => h.findIndex(x=>re.test(x));
        di = Math.max(0, find(/desc|item|card|name|title/));
        ni = find(/net\s*price|net\s*payment|payout|you\s*receive|^net$/);
        gi = find(/sales?\s*price|gross|amount|^price$/);
        start = hdr+1;
      }
      const sales=[];
      for(let i=start;i<rows.length;i++){
        const row = rows[i];
        const desc = String((row[di]!=null?row[di]:row[0])||"").trim();
        if(!desc || !/[a-z]/i.test(desc)) continue;
        if(/total items|gross sales|net sales|net payment|probstein|cash advance|affiliate/i.test(desc)) continue;
        const nums = row.filter((_,idx)=>idx!==di).map(num).filter(n=>!isNaN(n) && n>0);
        if(!nums.length) continue;
        const gross = (gi>=0 && num(row[gi])>0) ? num(row[gi]) : nums[0];
        const net   = (ni>=0 && num(row[ni])>0) ? num(row[ni]) : nums[nums.length-1];
        if(!net) continue;
        sales.push({ desc, gross, net });
      }
      if(!sales.length){ toast("No sale rows found in that CSV"); return; }
      const pool = state.items.filter(isCard);   // include sold cards so a re-import can correct prior sales
      if(!pool.length){ toast("No cards to match — import purchases first"); return; }
      const key = localStorage.getItem(KEY_KEY);
      if(key){
        try{ probMatches = await matchProbsteinAI(sales, pool); openProbReview(); return; }
        catch(e){ console.warn("AI match failed, using basic matcher", e); toast("Claude match unavailable — used basic matching"); }
      }
      probMatches = matchProbsteinRegex(sales, pool);
      openProbReview();
    }catch(e){ console.error(e); toast("Couldn't read that CSV"); }
  };
  r.readAsText(file);
}

}

    <p class="sub">${probMatches.length} payout row${probMatches.length===1?"":"s"} · ${matched} auto-matched. Confirm each card, then record. Net payout becomes the sale price.</p>
    <div class="review" id="revList">${probRows()}</div>
    <div class="btn" id="probCommitBtn" onclick="commitProbstein()" style="cursor:pointer">Record ${matched} sale${matched===1?"":"s"}</div>
    <div style="height:8px"></div>
    <button class="btn sec sm" onclick="closeReview()">Cancel</button>
  `;
  document.getElementById("ov-review").classList.add("open");
  document.body.style.overflow="hidden";
}
// Strip every stored photo — keeps all card data, frees ~90% of storage so
// the data file drops well under GitHub's 1 MB sync limit.
function dropAllPhotos(){
  const n = state.items.filter(it=>it.photo).length;
  if(!n){ toast("No photos to remove"); return; }
  if(!confirm("Remove photos from all "+n+" item"+(n===1?"":"s")+"?\n\nThis keeps every card's data (names, prices, grades, sales) — it only deletes the images, to free storage and fix syncing. This can't be undone. Export a JSON backup first if you want to keep the pictures.")) return;
  state.items.forEach(it=> it.photo = null);
  save(); rerender();
  toast("Removed "+n+" photo"+(n===1?"":"s")+" — storage freed, sync unblocked");
}

function commitProbstein(){
  const picks = probMatches.filter(m=>m.cardId);
  if(!picks.length){ toast("No cards matched — pick at least one"); return; }
  let n=0;
  picks.forEach(m=>{
    const it = state.items.find(x=>x.id===m.cardId);
    if(!it) return;
    it.salePrice = String(m.net);     // net payout (after Probstein's cut) by request
    it.saleVenue = "Probstein";
    it.status = "sold";               // isSold() is driven by salePrice>0; saleDate left blank
    n++;
  });
  save();
  document.getElementById("ov-review").classList.remove("open");
  document.body.style.overflow=""; probMatches=[];
  rerender();
  toast("Recorded "+n+" Probstein sale"+(n===1?"":"s"));
}

/* ============================================================
   PHOTOS bulk add (Data tab)
   ============================================================ */
async function handlePhotoFiles(files){
  if(!files||!files.length) return;
  const key = localStorage.getItem(KEY_KEY);
  toast("Adding "+files.length+" photo"+(files.length===1?"":"s")+"…");
  reviewItems = [];
  for(const f of files){
    const it = blankItem(); it.id=uid(); it.created=Date.now(); it.status="owned"; it.route="probstein";
    try{
      it.photo = await resizeImage(f);
      if(key){
        try{ const d = await visionParse(it.photo);
          it.name=d.name||""; it.set=d.set||""; it.cardNum=d.cardNum||"";
          it.gradeCo=d.gradeCo||""; it.grade=String(d.grade||""); it.cert=d.cert||"";
        }catch(e){ console.warn("vision failed for one photo",e); }
      }
    }catch(e){ console.warn(e); }
    reviewItems.push(it);
  }
  openReview(reviewItems.length+" photo"+(reviewItems.length===1?"":"s")+(key?" scanned":" added"));
}

function download(name, content, type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportJSON(){
  download(`pokealpha-crm-${todayStr()}.json`, JSON.stringify(state,null,2), "application/json");
  toast("JSON exported");
}
function csvCell(v){ const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
const TEMPLATE_COLS = ["kind","name","set","cardNum","gradeCo","grade","cert","source","route","status",
  "purchasePrice","purchaseDate","orderNum","gradingCost","fees","salePrice","saleDate","saleVenue","notes"];
function downloadCSVTemplate(){

    "120.00","2025-01-15","14-12345-67890","","8.50","","","","example row — delete before import"];

    return cols.map(c=> csvCell(c in ext ? ext[c] : it[c])).join(",");

  toast("CSV exported");

/* ============================================================
   CLOUD SYNC — GitHub repo (last-write-wins; one device at a time)
   ============================================================ */
const GH_KEY = "pokealpha-crm-gh";
let ghSha = null, pushTimer = null, _syncState = "idle", _syncMsg = "";

function ghCfg(){ try{ const r=localStorage.getItem(GH_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function ghConfigured(){ const c=ghCfg(); return !!(c && c.owner && c.repo && c.token); }
function utf8ToB64(str){ const b=new TextEncoder().encode(str); let s=""; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); }
function b64ToUtf8(b64){ const bin=atob(String(b64).replace(/\s/g,"")); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
function ghHeaders(c){ return {"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}; }
function ghUrl(c){ return "https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+c.path; }

async function ghPull(){
  const c=ghCfg(); if(!ghConfigured()) throw new Error("not configured");
  const res=await fetch(ghUrl(c)+"?ref="+encodeURIComponent(c.branch||"main")+"&t="+Date.now(),{headers:ghHeaders(c)});
  if(res.status===404){ ghSha=null; return null; }
  if(!res.ok) throw new Error("GitHub "+res.status+" "+(await res.text()).slice(0,100));
  const j=await res.json(); ghSha=j.sha;
  return JSON.parse(b64ToUtf8(j.content||""));
}
async function ghPush(){
  const c=ghCfg(); if(!ghConfigured()) throw new Error("not configured");
  const mk=sha=>{ const b={message:"PokéAlpha CRM "+new Date().toISOString(),content:utf8ToB64(JSON.stringify(state)),branch:c.branch||"main"}; if(sha) b.sha=sha; return b; };
  const put=body=>fetch(ghUrl(c),{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ghHeaders(c)),body:JSON.stringify(body)});
  let res=await put(mk(ghSha));
  if(res.status===409 || res.status===422){              // stale/missing sha → refresh & retry (last write wins)
    const g=await fetch(ghUrl(c)+"?ref="+encodeURIComponent(c.branch||"main")+"&t="+Date.now(),{headers:ghHeaders(c)});
    ghSha = g.ok ? (await g.json()).sha : null;
    res=await put(mk(ghSha));
  }
  if(!res.ok) throw new Error("GitHub "+res.status+" "+(await res.text()).slice(0,100));
  ghSha=(await res.json()).content.sha;
}
function schedulePush(){
  if(!ghConfigured()) return;
  clearTimeout(pushTimer); setSyncStatus("pending");
  pushTimer=setTimeout(async()=>{ setSyncStatus("syncing"); try{ await ghPush(); setSyncStatus("ok"); }catch(e){ console.error(e); setSyncStatus("err",e.message); } },1500);
}
async function initSync(){
  if(!ghConfigured()){ paintSync(); return; }
  setSyncStatus("syncing");
  try{
    const remote=await ghPull();
    if(remote){
      const rT=num(remote.updatedAt), lT=num(state.updatedAt);
      if(rT>=lT){ state=remote; if(!Array.isArray(state.items)) state.items=[]; persistLocal(); rerender(); }   // adopt shared latest
      else { await ghPush(); }                                                                                  // local newer → push
    } else { await ghPush(); }                                                                                  // create file first time
    setSyncStatus("ok");
  }catch(e){ console.error(e); setSyncStatus("err",e.message); }
}
function setSyncStatus(s,msg){ _syncState=s; _syncMsg=msg||""; paintSync(); }
function syncStatusText(){
  if(!ghConfigured()) return "Not syncing — data is only on this device.";
  return ({ok:"✓ Synced with GitHub",syncing:"⟳ Syncing…",pending:"… changes pending",err:"⚠️ Sync error: "+_syncMsg}[_syncState])||"Ready";
}
function paintSync(){
  const el=document.getElementById("syncStat");
  if(el){
    if(!ghConfigured()){ el.textContent="local only"; el.style.color="var(--muted2)"; }
    else { el.textContent=({ok:"✓ synced",syncing:"⟳ syncing",pending:"… pending",err:"⚠ sync error"}[_syncState])||"sync";
           el.style.color=({ok:"var(--green)",syncing:"var(--amber)",pending:"var(--amber)",err:"var(--red)"}[_syncState])||"var(--muted)"; }
  }
  const gs=document.getElementById("gh-status"); if(gs) gs.textContent=syncStatusText();
}
function saveGhCfg(){
  const v=id=>((document.getElementById(id)||{}).value||"");
  const cfg={owner:v("gh-owner").trim(),repo:v("gh-repo").trim(),branch:v("gh-branch").trim()||"main",path:v("gh-path").trim()||"crm-data.json",token:v("gh-token").trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token){ toast("Fill owner, repo and token"); return; }
  localStorage.setItem(GH_KEY,JSON.stringify(cfg)); ghSha=null;
  toast("Sync settings saved"); renderData(); initSync();
}
async function manualPull(){
  if(!ghConfigured()){ toast("Set up sync first"); return; }
  if(!confirm("Pull from GitHub and REPLACE the data on this device?")) return;
  setSyncStatus("syncing");
  try{ const r=await ghPull(); if(r){ state=r; if(!Array.isArray(state.items)) state.items=[]; persistLocal(); rerender(); toast("Pulled latest ✓"); } else toast("No data file yet — Push first"); setSyncStatus("ok"); }
  catch(e){ console.error(e); toast("Pull failed: "+e.message); setSyncStatus("err",e.message); }
}
async function manualPush(){
  if(!ghConfigured()){ toast("Set up sync first"); return; }
  setSyncStatus("syncing");
  try{ await ghPush(); toast("Pushed ✓"); setSyncStatus("ok"); }
  catch(e){ console.error(e); toast("Push failed: "+e.message); setSyncStatus("err",e.message); }
}

/* ============================================================
   P&L — TWO TRACKS THAT CONVERGE
     TRACK "flip"  = bought already-slabbed, resold        (gradingCost == 0 && cert)
     TRACK "grade" = bought raw, HE graded it, then sold   (gradingCost  > 0)
   Discriminator is GRADING COST, never the route tag or card name.
   ============================================================ */
function trackOf(it){
  if(!isCard(it)) return null;
  if(num(it.gradingCost) > 0) return "grade";
  if(it.cert) return "flip";
  return "raw";                       // bought raw, not yet submitted
}
function pnlOf(it){ return isSold(it) ? num(it.salePrice) - costBasis(it) : 0; }
function gradeNumOf(it){ const m=String(it.grade||"").match(/[\d.]+/); return m?parseFloat(m[0]):null; }
function fmtOf(it){ return (it.buyFormat||"").toLowerCase()||"unknown"; }

let plView = "all";                   // all | flip | grade
function setPLView(v){ plView=v; renderPL(); }

function rollup(items){
  const sold=items.filter(isSold), open=items.filter(it=>!isSold(it));
  const net=sold.reduce((a,it)=>a+num(it.salePrice),0);
  const cost=sold.reduce((a,it)=>a+costBasis(it),0);
  const pnl=net-cost;
  const days=sold.map(daysHeld).filter(d=>d!=null);
  return { n:items.length, nSold:sold.length, nOpen:open.length,
    net, cost, pnl, roi: cost>0? pnl/cost*100 : 0,
    openCost: open.reduce((a,it)=>a+costBasis(it),0),
    avgDays: days.length? Math.round(days.reduce((a,b)=>a+b,0)/days.length) : null };
}
function groupPL(items, keyFn){
  const g={};
  items.filter(isSold).forEach(it=>{
    const k=keyFn(it); if(k==null||k==="") return;
    if(!g[k]) g[k]={k, n:0, cost:0, net:0};
    g[k].n++; g[k].cost+=costBasis(it); g[k].net+=num(it.salePrice);
  });
  return Object.values(g).map(r=>({...r, pnl:r.net-r.cost, roi:r.cost>0?(r.net-r.cost)/r.cost*100:0}))
    .sort((a,b)=>b.pnl-a.pnl);
}
function plCard(label, sub, val, cls){
  return `<div class="stat"><div class="lbl">${label}</div><div class="val ${cls||'neu'}">${val}</div><div class="sub">${sub}</div></div>`;
}
function plTable(title, rows, labelFn){
  if(!rows.length) return "";
  let h=`<div class="section-h">${title}</div><div class="list">`;
  rows.forEach(r=>{
    const c=r.pnl>0?'pos':r.pnl<0?'neg':'neu';
    h+=`<div class="item"><div class="body">
      <div class="nm">${esc(labelFn?labelFn(r.k):String(r.k))}</div>
      <div class="meta">${r.n} sold · ${money(r.cost)} cost → ${money(r.net)} net</div></div>
      <div class="right"><div class="pnl ${c}">${money(r.pnl)}</div>
      <div class="route-tag">${r.cost>0?pct(r.roi):'—'}</div></div></div>`;
  });
  return h+`</div>`;
}
function renderPL(){
  const v=document.getElementById("view-psa");
  const cards=state.items.filter(isCard);
  const flips=cards.filter(it=>trackOf(it)==="flip");
  const grades=cards.filter(it=>trackOf(it)==="grade");
  const raws=cards.filter(it=>trackOf(it)==="raw");
  const F=rollup(flips), G=rollup(grades);

  const chip=(id,label,n)=>`<button class="chip ${plView===id?'on':''}" onclick="setPLView('${id}')">${label}<span class="n">${n}</span></button>`;
  let html=`<div class="chips">${chip('all','Combined',flips.length+grades.length)}${chip('flip','Flips',flips.length)}${chip('grade','Graded',grades.length)}</div>`;

  if(plView==="all"){
    const tot=rollup(flips.concat(grades));
    html+=`<div class="stats">
      ${plCard("Realized P&amp;L","both tracks",money(tot.pnl),tot.pnl>0?'pos':tot.pnl<0?'neg':'neu')}
      ${plCard("Realized ROI","on "+money(tot.cost)+" cost",tot.cost>0?pct(tot.roi):'—',tot.roi>0?'pos':'neu')}
      ${plCard("Capital in flight",tot.nOpen+" open",money(tot.openCost))}
      ${plCard("Sold",tot.nSold+" of "+tot.n,String(tot.nSold))}
    </div>`;
    // head-to-head
    const cmp=(L,R,fmt)=>`<div class="item"><div class="body"><div class="nm">${L}</div></div>
      <div class="right"><div class="pnl neu mono">${fmt}</div></div></div>`;
    html+=`<div class="section-h">Which method wins</div><div class="list">
      ${cmp("💎 Flips · realized P&L", null, money(F.pnl))}
      ${cmp("🏷️ Graded · realized P&L", null, money(G.pnl))}
      ${cmp("💎 Flips · ROI", null, F.cost>0?pct(F.roi):'—')}
      ${cmp("🏷️ Graded · ROI", null, G.cost>0?pct(G.roi):'—')}
      ${cmp("💎 Flips · avg days held", null, F.avgDays!=null?F.avgDays+"d":'—')}
      ${cmp("🏷️ Graded · avg days held", null, G.avgDays!=null?G.avgDays+"d":'—')}
    </div>`;
    const verdict = (F.cost>0&&G.cost>0)
      ? (F.roi>G.roi ? "Flips are returning more per dollar right now."
                     : "Grading is returning more per dollar right now.")
      : "Need sales on both tracks to compare.";
    html+=`<div class="note" style="margin-top:10px"><b>Read:</b> ${verdict}</div>`;
    if(raws.length) html+=`<div class="note" style="margin-top:8px">📦 ${raws.length} raw card${raws.length===1?'':'s'} not yet submitted · ${money(raws.reduce((a,it)=>a+costBasis(it),0))}</div>`;
  } else {
    const items = plView==="flip"? flips : grades;
    const R=rollup(items);
    const isG = plView==="grade";
    html+=`<div class="stats">
      ${plCard("Realized P&amp;L", R.nSold+" sold", money(R.pnl), R.pnl>0?'pos':R.pnl<0?'neg':'neu')}
      ${plCard("ROI","on "+money(R.cost)+" cost", R.cost>0?pct(R.roi):'—', R.roi>0?'pos':'neu')}
      ${plCard("Capital in flight", R.nOpen+" open", money(R.openCost))}
      ${plCard("Avg days held", isG?"buy → grade → sell":"buy → sell", R.avgDays!=null?R.avgDays:'—')}
    </div>`;
    html+=plTable("P&L by source", groupPL(items, it=>it.source||"(unknown)"));
    html+=plTable("P&L by buy format", groupPL(items, fmtOf), k=>({bin:"Buy It Now",auction:"Auction",offer:"Best Offer",unknown:"Unknown format"}[k]||k));
    if(isG) html+=plTable("P&L by grade received", groupPL(items, it=>{const g=gradeNumOf(it);return g==null?null:"PSA "+g;}));
    else    html+=plTable("P&L by grade bought", groupPL(items, it=>{const g=gradeNumOf(it);return g==null?null:"PSA "+g;}));
    const top=items.filter(isSold).sort((a,b)=>pnlOf(b)-pnlOf(a));
    if(top.length){
      html+=`<div class="section-h">Best &amp; worst</div><div class="list">`;
      html+=top.slice(0,3).map(itemRow).join("");
      if(top.length>3) html+=top.slice(-2).map(itemRow).join("");
      html+=`</div>`;
    }
    const open=items.filter(it=>!isSold(it)).sort((a,b)=>costBasis(b)-costBasis(a));
    if(open.length){
      html+=`<div class="section-h">Open · push these <span style="color:var(--muted2);font-weight:600">· ${money(R.openCost)}</span></div>`;
      html+=`<div class="list">${open.slice(0,8).map(itemRow).join("")}</div>`;
    }
  }
  // review queue from the auto-pull
  const rq=(state.reviewQueue||[]);
  if(rq.length) html+=`<div class="note" style="margin-top:12px;border-left:3px solid var(--amber)"><b>⚠️ ${rq.length} unmatched</b> awaiting review — auto-pull would not write these without a cert match.</div>`;
  const gaps=cards.filter(it=>!num(it.purchasePrice)||!it.source).length;
  if(gaps) html+=`<div class="note" style="margin-top:8px">🔍 ${gaps} card${gaps===1?'':'s'} missing purchase price or source — next sync will try to fill from eBay.</div>`;
  v.innerHTML=html;
}

load();
switchTab("dash");
initSync();
</script>
